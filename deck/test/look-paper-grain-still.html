<!doctype html>
<meta charset="utf-8">
<title>look: paper-grain — a StoryDeck map in footprint-story's look</title>
<style>/* isometric pieces: blocks on a floor seen from a corner (deck/iso.js) */
:where(section[data-label] [data-sd-iso]) { position: absolute; box-sizing: border-box; --sd-hot-width: 0px; --iso-turn: var(--sd-turn, 0s); }
/* what it draws takes the pointer: its faces and its words, never the empty corners of its box. Only on the slide
   shown (deck-stage's [data-deck-active]): a slide that takes no pointer stays that way — "auto" written on a face
   would bring it back there — and a piece shown anywhere else (a Read lens) is left as it was */
:where(section[data-label][data-deck-active] [data-sd-iso]) { pointer-events: none; }
:where(section[data-label][data-deck-active] [data-sd-iso] :is(.iso-art > *, .iso-say)) { pointer-events: auto; }
:where(section[data-label] .iso-art) {
  position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;
  stroke: var(--iso-line, var(--iso-ink, #14181f)); stroke-width: var(--iso-line-width, 2.5px); stroke-linejoin: round;
}
:where(section[data-label] .iso-top) { fill: color-mix(in srgb, var(--iso-color, var(--sd-tone, #d9e4f3)) 80%, #fff); }
:where(section[data-label] .iso-left) { fill: color-mix(in srgb, var(--iso-color, var(--sd-tone, #d9e4f3)) 94%, #000); }
:where(section[data-label] :is(.iso-right, .iso-side)) { fill: color-mix(in srgb, var(--iso-color, var(--sd-tone, #d9e4f3)) 82%, #000); }
:where(section[data-label] .iso-ground) { fill: var(--iso-floor, transparent); stroke: none; }
:where(section[data-label] .iso-lines) { fill: none; stroke: var(--iso-grid, color-mix(in srgb, var(--fg, #14181f) 16%, transparent)); stroke-width: 1.5px; }
:where(section[data-label] .iso-say) {
  position: absolute; translate: -50% -50%; display: grid; justify-items: center; gap: 2px; text-align: center; white-space: nowrap;
  font: 700 26px/1.15 var(--sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); color: var(--iso-ink, #000000);
}
:where(section[data-label] .iso-say small) { font-size: 18px; font-weight: 500; color: color-mix(in srgb, var(--iso-ink, #000000) 85%, transparent); }
:where(section[data-label] .iso-say svg.ic) { width: 40px; height: 40px; color: var(--iso-ink, #14181f); }
/* a callout is words about the picture: over every block, whose levels end at 512 (a lead into a port at one more) */
:where(section[data-label] [data-sd-callout]) { z-index: 514; }
/* its highlight (data-hot) rings what it draws; the box's own ring is off (--sd-hot-width: 0, read by focus.css) */
:where(section[data-label] .sd-hot:is([data-sd-iso="block"], [data-sd-iso="cylinder"]) .iso-art) { filter: drop-shadow(5px 0 0 var(--sd-hot, #ef4444)) drop-shadow(-5px 0 0 var(--sd-hot, #ef4444)) drop-shadow(0 5px 0 var(--sd-hot, #ef4444)) drop-shadow(0 -5px 0 var(--sd-hot, #ef4444)); }
:where(section[data-label] .sd-hot[data-sd-iso="floor"] .iso-ground) { stroke: var(--sd-hot, #ef4444); stroke-width: 5px; }
/* on a forward click the ring comes when a box's does: .3s after the piece's moment (--sd-turn: 0 off a route, its turn
   on one, later under a new blur). That moment is not inherited, so the piece hands it to its faces as --iso-turn */
@keyframes sdIsoRing { from { filter: drop-shadow(5px 0 0 transparent) drop-shadow(-5px 0 0 transparent) drop-shadow(0 5px 0 transparent) drop-shadow(0 -5px 0 transparent); } }
@media screen and (prefers-reduced-motion: no-preference) {
  :where(section[data-label][data-deck-active]:not([data-sd-instant]):not([data-deck-static]) .sd-hot-in:is([data-sd-iso="block"], [data-sd-iso="cylinder"]) .iso-art) { animation: sdIsoRing .6s ease calc(.3s + var(--iso-turn, 0s)) both; }
}

/* a map drawn in a look, on a dark page (deck/iso.js · LOOK_CSS): the page's paper and ink */
:where(:root.dark section[data-label] [data-sd-paper]) { --iso-paper: var(--bg-elev, #ffffff); --iso-ink: var(--fg, #14181f); --sd-ink: var(--fg, #14181f); }
:where(:root.dark section[data-label] [data-sd-iso]) { --sd-contour: var(--fg, #14181f); }
:where(:root.dark section[data-label] .iso-contour) { stroke: var(--fg, #14181f); }</style>
