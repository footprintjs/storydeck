name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4   # ffmpeg's packages: the mirror can be very slow, and apt checks each one's hash, so a saved copy is safe
        with:
          path: ~/apt-ffmpeg
          key: ci-apt-ffmpeg-ubuntu-24.04-v1
      - run: |   # the real-ffmpeg video test runs on CI, never skips
          mkdir -p ~/apt-ffmpeg/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-ffmpeg" ffmpeg
          sudo chown -R "$USER" ~/apt-ffmpeg
        timeout-minutes: 25
      - run: npm ci
      - run: npm run test:cov
      - run: npm run build          # the compiled dist/ the package ships (prepack builds it again for npm pack)
      - run: npm run check:dist     # every door loads in plain Node; no source JSX in the package
      - run: npm run check:publint
